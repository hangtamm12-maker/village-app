<link rel="stylesheet" href="styles.css?v=7">
<section id="page-checkin" hidden>
  <div class="topbar">
    <button class="back" type="button" data-go="menu"><svg data-icon="back"></svg>เมนูหลัก</button>
  </div>
  <h1>ลงชื่อเข้าร่วมประชุม</h1>
  <p class="lead">ลงชื่อครั้งเดียวต่อบ้าน สมาชิกคนใดในบ้านลงชื่อก็ได้ ลงชื่อได้ถึงวันประชุมเท่านั้น</p>
  <div id="checkin-msg" role="alert"></div>
  <div id="checkin-body"></div>

  <!-- สแกนด้วยกล้องของเครื่องผ่านหน้าเว็บ: ใช้เมื่อกล้องของ LINE (scanCodeV2) ใช้ไม่ได้ -->
  <dialog class="qr-dialog" id="scan-dialog" aria-labelledby="scan-title">
    <h2 id="scan-title">สแกน QR code ที่หน้างาน</h2>
    <video id="scan-video" playsinline muted hidden style="width:100%;margin:12px 0;border-radius:12px;background:#000"></video>
    <p class="small" id="scan-msg" role="status"></p>
    <label class="btn btn-ghost" for="scan-photo">ถ่ายรูป QR code แทน</label>
    <input type="file" id="scan-photo" accept="image/*" capture="environment" hidden>
    <form method="dialog" style="margin-top:12px"><button class="btn btn-ghost">ยกเลิก</button></form>
  </dialog>
</section>

<script>
/** ค่าจาก QR → { meetingId, key } รับเฉพาะลิงก์ ?page=checkin&m=... (รวมลิงก์ liff.line.me ที่ค่าอยู่ใน liff.state) */
function checkinFromQr(value) {
  let url;
  try {
    url = new URL(value);
  } catch (_) {
    return null;
  }
  let q = url.searchParams;
  const state = q.get('liff.state');
  if (state) q = new URLSearchParams(state.slice(state.indexOf('?') + 1));
  return q.get('page') === 'checkin' && q.get('m') ? { meetingId: q.get('m'), key: q.get('k') || '' } : null;
}

/** โหลดตัวอ่าน QR จากภาพ ครั้งแรกที่ต้องใช้กล้องผ่านหน้าเว็บเท่านั้น */
function loadJsQr() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('โหลดตัวอ่าน QR ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'));
    document.head.append(s);
  });
}

/** อ่าน QR จากภาพ/เฟรมวิดีโอ (ย่อให้กว้างไม่เกิน max px ให้อ่านเร็ว) → ข้อความใน QR หรือ '' */
function readQr(source, w, h, max) {
  const scale = Math.min(1, max / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
  return code ? code.data : '';
}

/**
 * เปิดกล้องของเครื่องในหน้าเว็บแล้วอ่าน QR → ข้อความใน QR ('' = ยกเลิก)
 * กล้องสดเปิดไม่ได้ (เบราว์เซอร์ใน LINE บางเครื่อง/ไม่อนุญาต) → ถ่ายรูป QR ด้วยแอปกล้องแทน
 */
async function webScanQr() {
  await loadJsQr();
  const dlg = $('scan-dialog');
  const video = $('scan-video');
  const msg = $('scan-msg');
  const photo = $('scan-photo');
  let stream = null;
  let raf = 0;
  return new Promise((resolve) => {
    let done = false;
    const finish = (value) => {
      if (done) return;
      done = true;
      cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      video.srcObject = null;
      photo.onchange = null;
      if (dlg.open) dlg.close();
      resolve(value);
    };
    dlg.addEventListener('close', () => finish(''), { once: true });
    photo.value = '';
    photo.onchange = () => {
      const file = photo.files[0];
      if (!file) return;
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const value = readQr(img, img.naturalWidth, img.naturalHeight, 1200);
        if (value) finish(value);
        else msg.textContent = 'อ่าน QR code จากรูปไม่ได้ ลองถ่ายใหม่ให้ QR ชัดและอยู่กลางภาพ';
      };
      img.onerror = () => { msg.textContent = 'เปิดรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง'; };
      img.src = url;
    };
    msg.textContent = 'กำลังเปิดกล้อง… ถ้ากล้องไม่ขึ้น กดปุ่ม "ถ่ายรูป QR code แทน" ด้านล่าง';
    video.hidden = true;
    dlg.showModal();

    const tick = () => {
      if (done) return;
      if (video.readyState >= 2) {
        const value = readQr(video, video.videoWidth, video.videoHeight, 640);
        if (value) return finish(value);
      }
      raf = requestAnimationFrame(tick);
    };
    Promise.resolve()
      .then(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }))
      .then((s) => {
        stream = s;
        if (done) return finish('');
        video.srcObject = s;
        video.hidden = false;
        msg.textContent = 'หันกล้องไปที่ QR code';
        return video.play().then(tick);
      })
      .catch(() => {
        if (!done) msg.textContent = 'เปิดกล้องในหน้านี้ไม่ได้ กดปุ่ม "ถ่ายรูป QR code แทน" ด้านล่าง';
      });
  });
}

App.register('checkin', {
  memberOnly: true,

  async enter(params) {
    const body = $('checkin-body');
    const msg = $('checkin-msg');
    const wantedId = params.meetingId || '';
    const checkins = {};

    fill(msg);
    fill(body, loadingBox('กำลังโหลดการประชุม…'));

    let res;
    try {
      res = await App.api('meetings');
    } catch (err) {
      fill(body, errorBox(err.message));
      return;
    }
    render(res, null);

    // สแกน QR ด้วยกล้องมือถือ (ลิงก์มี k=) → ลงชื่อให้ทันทีถ้ายังเปิดลงชื่อและบ้านยังไม่ได้ลงชื่อ
    if (params.key && checkins[wantedId]) checkins[wantedId](params.key);

    function render(r, justCheckedIn) {
      const meetings = r.meetings || [];
      // ไม่ระบุประชุม: แสดงที่เปิดลงชื่อวันนี้ + ที่กำลังจะมาถึง (ตั้งแจ้งเตือนได้)
      const list = wantedId
        ? meetings.filter((m) => m.id === wantedId)
        : meetings.filter((m) => m.open || m.early || m.canRemind);

      const plate = h('div', { class: 'plate' }, h('div', { class: 'plate-inner' },
        h('div', { class: 'plate-label', text: 'ลงชื่อในนามบ้านเลขที่' }),
        h('div', { class: 'plate-no', text: r.houseNo || '–' })));

      const banner = justCheckedIn
        ? h('div', { class: 'status ok' },
          h('h2', { text: 'ลงชื่อเข้าร่วมประชุมเรียบร้อย' }),
          h('p', { text: `บันทึกการเข้าร่วมของบ้านเลขที่ ${r.houseNo} แล้ว` }))
        : null;

      if (!list.length) {
        fill(body, plate,
          wantedId
            ? errorBox('ไม่พบการประชุมตาม QR code นี้ กรุณาสอบถามผู้ดูแล')
            : h('div', { class: 'card empty' },
              h('p', { text: 'ขณะนี้ยังไม่มีการประชุมที่เปิดให้ลงชื่อหรือกำลังจะมาถึง' }),
              h('p', { class: 'small', text: 'ผู้ดูแลจะเปิดให้ลงชื่อในวันประชุม' })),
          h('button', { class: 'btn btn-ghost', type: 'button', 'data-go': 'calendar', text: 'ดูปฏิทินการประชุม' }));
        return;
      }

      fill(body, banner, plate, list.map((m) => meetingCard(m, {
        hideDetail: true,
        action: actionFor(m),
      })));
    }

    function actionFor(m) {
      if (m.attended) {
        return h('div', { class: 'status ok', style: 'margin:14px 0 0' },
          h('p', { text: `ลงชื่อแล้วโดย ${m.attendedBy}${m.attendedAt ? ` เวลา ${m.attendedAt} น.` : ''}` }));
      }
      if (m.expired) {
        return h('div', { class: 'status wait', style: 'margin:14px 0 0' },
          h('p', { text: 'การประชุมนี้ผ่านไปแล้ว ลงชื่อย้อนหลังไม่ได้' }));
      }
      if (m.early) {
        return h('div', {},
          h('div', { class: 'status wait', style: 'margin:14px 0 0' },
            h('p', { text: `ยังไม่ถึงวันประชุม ลงชื่อได้ใน${fmtDateLong(m.date)}` })),
          reminderBox(m));
      }
      if (!m.open) {
        return h('div', {},
          h('div', { class: 'status wait', style: 'margin:14px 0 0' },
            h('p', { text: 'การประชุมนี้ยังไม่เปิดให้ลงชื่อ หรือปิดลงชื่อแล้ว' })),
          reminderBox(m));
      }
      const err = h('div', { class: 'err' });
      const btn = h('button', { class: 'btn', type: 'button', text: 'ลงชื่อเข้าร่วมประชุม' });
      const submit = checkins[m.id] = async (key) => {
        btn.disabled = true;
        btn.textContent = 'กำลังลงชื่อ…';
        err.textContent = '';
        try {
          render(await App.api('checkin', { meetingId: m.id, key }), m.id);
          window.scrollTo(0, 0);
        } catch (e) {
          err.textContent = e.message;
          btn.disabled = false;
          btn.textContent = 'ลงชื่อเข้าร่วมประชุม';
        }
      };
      // ลงชื่อได้เฉพาะคนที่สแกน QR หน้างาน → กดแล้วเปิดกล้อง
      btn.addEventListener('click', async () => {
        err.textContent = '';
        try {
          const key = await scanKey(m.id);
          if (key) submit(key);
        } catch (e) {
          err.textContent = e.message;
        }
      });
      return h('div', {}, btn,
        h('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'กดแล้วสแกน QR code ที่หน้างาน' }),
        err, reminderBox(m));
    }

    /** เปิด/ปิดแจ้งเตือนทาง LINE (ค่าเริ่มต้นปิด) ได้ถึง 30 นาทีก่อนเริ่มประชุม หลังจากนั้นซ่อนปุ่ม */
    function reminderBox(m) {
      if (m.remindSent) return h('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'ส่งข้อความแจ้งเตือนทาง LINE แล้ว' });
      if (!m.canRemind) return null;
      const err = h('div', { class: 'err' });
      const btn = h('button', {
        class: 'btn btn-ghost',
        type: 'button',
        'aria-pressed': String(!!m.remind),
        text: m.remind ? 'ปิดการแจ้งเตือน' : 'เปิดแจ้งเตือนการประชุม',
      });
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        err.textContent = '';
        try {
          render(await App.api('remind', { meetingId: m.id, on: !m.remind }), null);
        } catch (e) {
          err.textContent = e.message;
          btn.disabled = false;
        }
      });
      return h('div', { style: 'margin-top:12px' },
        btn,
        h('p', { class: 'small muted', style: 'margin:8px 0 0', text: m.remind
          ? `เปิดแจ้งเตือนแล้ว จะส่งข้อความ LINE ${m.remindAt}`
          : `กดเพื่อรับข้อความ LINE เตือน${m.remindAt}` }),
        err);
    }

    function canScan() {
      try {
        return liff.isApiAvailable('scanCodeV2');
      } catch (_) {
        return false;
      }
    }

    /** เปิดกล้องสแกน QR ของประชุมนี้ → รหัสลับใน QR ('' = กดยกเลิก) */
    async function scanKey(meetingId) {
      // กล้องของ LINE ก่อน (ใช้ได้เฉพาะหน้าที่เปิดผ่าน liff.line.me ในแอป LINE) ใช้ไม่ได้ → กล้องของเครื่องผ่านหน้าเว็บ
      let value = null;
      if (canScan()) {
        try {
          value = (await liff.scanCodeV2()).value || '';
        } catch (_) {
          value = null;
        }
      }
      if (value === null) value = await webScanQr();
      if (!value) return '';
      const qr = checkinFromQr(value);
      if (!qr) throw new Error('QR code นี้ไม่ใช่ QR สำหรับลงชื่อประชุม');
      if (qr.meetingId !== meetingId) throw new Error('QR code นี้เป็นของการประชุมอื่น');
      if (!qr.key) throw new Error('QR code นี้เป็นแบบเก่า กรุณาแจ้งผู้ดูแลให้พิมพ์ QR ใหม่');
      return qr.key;
    }
  },
});
</script>
