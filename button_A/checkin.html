<link rel="stylesheet" href="styles.css?v=7">
<section id="page-checkin" hidden>
  <div class="topbar">
    <button class="back" type="button" data-go="menu"><svg data-icon="back"></svg>เมนูหลัก</button>
  </div>
  <h1>ลงชื่อเข้าร่วมประชุม</h1>
  <p class="lead">ลงชื่อครั้งเดียวต่อบ้าน สมาชิกคนใดในบ้านลงชื่อก็ได้ ลงชื่อได้ถึงวันประชุมเท่านั้น</p>
  <div id="checkin-msg" role="alert"></div>
  <div id="checkin-body"></div>

  <!-- ผู้ดูแลเปิด QR ให้ลูกบ้านสแกนที่หน้างาน -->
  <dialog class="qr-dialog" id="checkin-qr" aria-labelledby="checkin-qr-title">
    <h2 id="checkin-qr-title"></h2>
    <p class="muted small" id="checkin-qr-date"></p>
    <div class="qr-box" id="checkin-qr-img"></div>
    <p class="small">สแกนด้วยกล้องมือถือ หรือกดปุ่ม "ลงชื่อเข้าร่วมประชุม" ในหน้าลงชื่อ</p>
    <form method="dialog"><button class="btn">ปิด</button></form>
  </dialog>
</section>

<script>
/** ค่าจาก QR → { meetingId, key } รับเฉพาะลิงก์ ?page=checkin&m=... (รวมลิงก์ liff.line.me ที่ค่าอยู่ใน liff.state) */
function checkinFromQr(value) {
  let url;
  try {
    url = new URL(value);
  } catch (_) {
    return null;
  }
  let q = url.searchParams;
  const state = q.get('liff.state');
  if (state) q = new URLSearchParams(state.slice(state.indexOf('?') + 1));
  return q.get('page') === 'checkin' && q.get('m') ? { meetingId: q.get('m'), key: q.get('k') || '' } : null;
}

function checkinQrUrl(m) {
  return `https://liff.line.me/${CONFIG.LIFF_ID}?page=checkin&m=${encodeURIComponent(m.id)}&k=${encodeURIComponent(m.qrKey)}`;
}

/** โหลดตัวสร้าง QR ตอนผู้ดูแลกดแสดง QR ครั้งแรกเท่านั้น */
function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'));
    document.head.append(s);
  });
}

App.register('checkin', {
  memberOnly: true,

  async enter(params) {
    const body = $('checkin-body');
    const msg = $('checkin-msg');
    const wantedId = params.meetingId || '';
    const checkins = {};

    fill(msg);
    fill(body, loadingBox('กำลังโหลดการประชุม…'));

    let res;
    try {
      res = await App.api('meetings');
    } catch (err) {
      fill(body, errorBox(err.message));
      return;
    }
    render(res, null);

    // สแกน QR ด้วยกล้องมือถือ (ลิงก์มี k=) → ลงชื่อให้ทันทีถ้ายังเปิดลงชื่อและบ้านยังไม่ได้ลงชื่อ
    if (params.key && checkins[wantedId]) checkins[wantedId](params.key);

    function render(r, justCheckedIn) {
      const meetings = r.meetings || [];
      // ไม่ระบุประชุม: แสดงที่เปิดลงชื่อวันนี้ + ที่กำลังจะมาถึง (ตั้งแจ้งเตือนได้)
      const list = wantedId
        ? meetings.filter((m) => m.id === wantedId)
        : meetings.filter((m) => m.open || m.early || m.canRemind);

      const plate = h('div', { class: 'plate' }, h('div', { class: 'plate-inner' },
        h('div', { class: 'plate-label', text: 'ลงชื่อในนามบ้านเลขที่' }),
        h('div', { class: 'plate-no', text: r.houseNo || '–' })));

      const banner = justCheckedIn
        ? h('div', { class: 'status ok' },
          h('h2', { text: 'ลงชื่อเข้าร่วมประชุมเรียบร้อย' }),
          h('p', { text: `บันทึกการเข้าร่วมของบ้านเลขที่ ${r.houseNo} แล้ว` }))
        : null;

      if (!list.length) {
        fill(body, plate,
          wantedId
            ? errorBox('ไม่พบการประชุมตาม QR code นี้ กรุณาสอบถามผู้ดูแล')
            : h('div', { class: 'card empty' },
              h('p', { text: 'ขณะนี้ยังไม่มีการประชุมที่เปิดให้ลงชื่อหรือกำลังจะมาถึง' }),
              h('p', { class: 'small', text: 'ผู้ดูแลจะเปิดให้ลงชื่อในวันประชุม' })),
          h('button', { class: 'btn btn-ghost', type: 'button', 'data-go': 'calendar', text: 'ดูปฏิทินการประชุม' }));
        return;
      }

      fill(body, banner, plate, list.map((m) => meetingCard(m, {
        hideDetail: true,
        action: h('div', {}, actionFor(m),
          // ผู้ดูแลเปิด QR ได้ตั้งแต่ก่อนวันประชุม (พิมพ์ติดไว้ล่วงหน้าได้)
          m.qrKey
            ? h('button', { class: 'btn btn-ghost', type: 'button', text: 'แสดง QR ให้ลูกบ้านสแกน', onclick: () => showQr(m) })
            : null),
      })));
    }

    function actionFor(m) {
      if (m.attended) {
        return h('div', { class: 'status ok', style: 'margin:14px 0 0' },
          h('p', { text: `ลงชื่อแล้วโดย ${m.attendedBy}${m.attendedAt ? ` เวลา ${m.attendedAt} น.` : ''}` }));
      }
      if (m.expired) {
        return h('div', { class: 'status wait', style: 'margin:14px 0 0' },
          h('p', { text: 'การประชุมนี้ผ่านไปแล้ว ลงชื่อย้อนหลังไม่ได้' }));
      }
      if (m.early) {
        return h('div', {},
          h('div', { class: 'status wait', style: 'margin:14px 0 0' },
            h('p', { text: `ยังไม่ถึงวันประชุม ลงชื่อได้ใน${fmtDateLong(m.date)}` })),
          reminderBox(m));
      }
      if (!m.open) {
        return h('div', {},
          h('div', { class: 'status wait', style: 'margin:14px 0 0' },
            h('p', { text: 'การประชุมนี้ยังไม่เปิดให้ลงชื่อ หรือปิดลงชื่อแล้ว' })),
          reminderBox(m));
      }
      const err = h('div', { class: 'err' });
      const btn = h('button', { class: 'btn', type: 'button', text: 'ลงชื่อเข้าร่วมประชุม' });
      const submit = checkins[m.id] = async (key) => {
        btn.disabled = true;
        btn.textContent = 'กำลังลงชื่อ…';
        err.textContent = '';
        try {
          render(await App.api('checkin', { meetingId: m.id, key }), m.id);
          window.scrollTo(0, 0);
        } catch (e) {
          err.textContent = e.message;
          btn.disabled = false;
          btn.textContent = 'ลงชื่อเข้าร่วมประชุม';
        }
      };
      // ลงชื่อได้เฉพาะคนที่สแกน QR หน้างาน → กดแล้วเปิดกล้อง
      btn.addEventListener('click', async () => {
        err.textContent = '';
        try {
          const key = await scanKey(m.id);
          if (key) submit(key);
        } catch (e) {
          err.textContent = e.message;
        }
      });
      return h('div', {}, btn,
        h('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'กดแล้วสแกน QR code ที่หน้างาน' }),
        err, reminderBox(m));
    }

    /** เปิด/ปิดแจ้งเตือนทาง LINE (ค่าเริ่มต้นปิด) ได้ถึง 30 นาทีก่อนเริ่มประชุม หลังจากนั้นซ่อนปุ่ม */
    function reminderBox(m) {
      if (m.remindSent) return h('p', { class: 'small muted', style: 'margin:8px 0 0', text: 'ส่งข้อความแจ้งเตือนทาง LINE แล้ว' });
      if (!m.canRemind) return null;
      const err = h('div', { class: 'err' });
      const btn = h('button', {
        class: 'btn btn-ghost',
        type: 'button',
        'aria-pressed': String(!!m.remind),
        text: m.remind ? 'ปิดการแจ้งเตือน' : 'เปิดแจ้งเตือนการประชุม',
      });
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        err.textContent = '';
        try {
          render(await App.api('remind', { meetingId: m.id, on: !m.remind }), null);
        } catch (e) {
          err.textContent = e.message;
          btn.disabled = false;
        }
      });
      return h('div', { style: 'margin-top:12px' },
        btn,
        h('p', { class: 'small muted', style: 'margin:8px 0 0', text: m.remind
          ? `เปิดแจ้งเตือนแล้ว จะส่งข้อความ LINE ${m.remindAt}`
          : `กดเพื่อรับข้อความ LINE เตือน${m.remindAt}` }),
        err);
    }

    function canScan() {
      try {
        return liff.isApiAvailable('scanCodeV2');
      } catch (_) {
        return false;
      }
    }

    /** เปิดกล้องสแกน QR ของประชุมนี้ → รหัสลับใน QR ('' = กดยกเลิก) */
    async function scanKey(meetingId) {
      if (!canScan()) {
        // กล้องของ LINE ใช้ได้เฉพาะหน้าที่เปิดผ่านลิงก์ liff.line.me ในแอป LINE บนมือถือ
        throw new Error(liff.isInClient()
          ? 'แอป LINE ในเครื่องนี้เปิดกล้องสแกนไม่ได้ กรุณาอัปเดตแอป LINE แล้วลองใหม่ หรือสแกน QR code ที่หน้างานด้วยกล้องมือถือ'
          : 'หน้านี้ไม่ได้เปิดในแอป LINE จึงเปิดกล้องไม่ได้ กรุณาเปิดจากเมนูในแชท LINE ของหมู่บ้าน หรือสแกน QR code ที่หน้างานด้วยกล้องมือถือ');
      }
      let value;
      try {
        value = (await liff.scanCodeV2()).value;
      } catch (_) {
        throw new Error('เปิดกล้องสแกนไม่สำเร็จ ลองสแกนด้วยกล้องมือถือแทน');
      }
      if (!value) return '';
      const qr = checkinFromQr(value);
      if (!qr) throw new Error('QR code นี้ไม่ใช่ QR สำหรับลงชื่อประชุม');
      if (qr.meetingId !== meetingId) throw new Error('QR code นี้เป็นของการประชุมอื่น');
      if (!qr.key) throw new Error('QR code นี้เป็นแบบเก่า กรุณาแจ้งผู้ดูแลให้พิมพ์ QR ใหม่');
      return qr.key;
    }

    async function showQr(m) {
      try {
        await loadQrLib();
      } catch (e) {
        fill(msg, errorBox(e.message));
        return;
      }
      const qr = qrcode(0, 'M');
      qr.addData(checkinQrUrl(m));
      qr.make();
      // svg จากไลบรารี (escape ข้อความ alt ให้แล้ว)
      $('checkin-qr-img').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true, alt: 'QR ลงชื่อ ' + m.title });
      $('checkin-qr-title').textContent = m.title;
      $('checkin-qr-date').textContent = [fmtDateLong(m.date), m.time ? `เวลา ${m.time} น.` : ''].filter(Boolean).join(' ');
      $('checkin-qr').showModal();
    }
  },
});
</script>
