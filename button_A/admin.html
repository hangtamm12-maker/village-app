<section id="page-admin" hidden>
  <div class="topbar">
    <button class="back" type="button" data-go="menu"><svg data-icon="back"></svg>เมนูหลัก</button>
  </div>
  <h1>สำหรับผู้ดูแล</h1>
  <p class="lead">เมนูนี้แสดงเฉพาะผู้ที่มี role เป็น admin</p>

  <h2>วันประชุม</h2>
  <button class="btn" type="button" data-go="checkin">แสดง QR ลงชื่อประชุม</button>

  <h2>แก้ไขข้อมูลใน Google Sheets</h2>
  <p class="muted small">เปิดด้วยบัญชี Google ที่ได้รับสิทธิ์แก้ไขชีตของหมู่บ้าน</p>
  <div id="admin-body"></div>
</section>

<script>
App.register('admin', {
  adminOnly: true,

  async enter() {
    const body = $('admin-body');
    fill(body, loadingBox('กำลังโหลด…'));
    try {
      const res = await App.api('admin');
      fill(body, h('ul', { class: 'calls' }, res.sheets.map((s) => h('li', {},
        h('a', { href: s.url, target: '_blank', rel: 'noopener' },
          icon('sheet'),
          h('span', {}, h('strong', { text: s.label }), h('small', { text: s.hint })),
          s.badge ? h('b', { class: 'count', text: s.badge }) : null)))));
    } catch (err) {
      fill(body, errorBox(err.message));
    }
  },
});
</script>
