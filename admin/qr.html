<link rel="stylesheet" href="styles.css?v=8">
<section id="page-admin-qr" hidden>
  <div class="topbar">
    <button class="back" type="button" data-go="admin"><svg data-icon="back"></svg>สำหรับผู้ดูแล</button>
  </div>
  <h1>QR ลงชื่อประชุม</h1>
  <div id="qr-upcoming"></div>
  <div id="qr-body"></div>
</section>

<script>
/** ลิงก์ใน QR: ต้องมีรหัสลับ k (ได้จากหลังบ้านเฉพาะผู้ดูแล) ลูกบ้านจึงลงชื่อได้ — เหมือน checkinQrUrl_ ใน Admin.gs */
function checkinQrUrl(m) {
  return `https://liff.line.me/${CONFIG.LIFF_ID}?page=checkin&m=${encodeURIComponent(m.id)}&k=${encodeURIComponent(m.qrKey)}`;
}

/** โหลดตัวสร้าง QR ครั้งแรกที่เปิดหน้านี้เท่านั้น */
function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('โหลดตัวสร้าง QR ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'));
    document.head.append(s);
  });
}

App.register('admin-qr', {
  adminOnly: true,

  async enter() {
    const body = $('qr-body');
    fill($('qr-upcoming'));
    fill(body, loadingBox('กำลังโหลดการประชุม…'));

    let upcoming;
    try {
      // หลังบ้านเรียงตามวันที่ และให้ qrKey เฉพาะประชุมที่เปิดลงชื่อวันนี้และที่ยังไม่ถึงวัน → ตัวแรก = ครั้งที่ใกล้ที่สุด
      upcoming = (await App.api('meetings')).meetings.filter((x) => x.qrKey);
      if (upcoming.length) await loadQrLib();
    } catch (err) {
      fill(body, errorBox(err.message));
      return;
    }
    const m = upcoming[0];
    // 📅 แตะแล้วเห็นรายการประชุมที่จะมาถึง เลือกครั้งไหนก็สร้าง QR ล่วงหน้าได้ (ค่าเริ่มต้น = ครั้งที่ใกล้ที่สุด)
    if (upcoming.length > 1) {
      const list = h('div', { id: 'qr-pick', class: 'small', style: 'margin:0 0 16px', hidden: true },
        upcoming.map((x, i) => h('label', { style: 'display:flex;gap:8px;align-items:baseline;padding:4px 0' },
          h('input', { type: 'radio', name: 'qr-meeting', value: i, checked: x === m }),
          h('span', {},
            h('span', { class: 'muted', text: fmtDateLong(x.date) + (x.time ? ` ${x.time} น.` : '') + ' · ' }),
            x.title))));
      const toggle = h('button', { type: 'button', title: 'การประชุมที่จะมาถึง',
        'aria-expanded': 'false', 'aria-controls': 'qr-pick',
        style: 'display:flex;align-items:center;gap:6px;font:inherit;color:var(--muted);background:none;border:0;padding:4px 0;margin:0 0 8px;cursor:pointer',
        onclick: () => {
          list.hidden = !list.hidden;
          toggle.setAttribute('aria-expanded', String(!list.hidden));
        } },
        h('span', { style: 'font-size:22px', 'aria-hidden': 'true', text: '📅' }),
        h('span', { class: 'small', style: 'text-decoration:underline', text: 'เลือกการประชุม' }));
      list.append(h('button', { class: 'btn btn-ghost', type: 'button', style: 'margin-top:8px', text: 'generate QR code ล่วงหน้า', onclick: () => {
        showQr(body, upcoming[Number(list.querySelector('input:checked').value)]);
        list.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
      } }));
      fill($('qr-upcoming'), toggle, list);
    }
    if (!m) {
      fill(body, h('div', { class: 'card empty' },
        h('p', { text: 'ยังไม่มีการประชุมวันนี้หรือที่กำลังจะมาถึง' }),
        h('p', { class: 'small', text: 'เพิ่มการประชุมในชีต Meetings และติ๊ก "เปิดลงชื่อ" ในวันประชุม' })));
      return;
    }
    showQr(body, m);
  },
});

/** การ์ด QR ของประชุม m (มี qrKey) */
function showQr(body, m) {
    const qr = qrcode(0, 'M');
    qr.addData(checkinQrUrl(m));
    qr.make();
    const box = h('div', { class: 'qr-box' });
    // svg จากไลบรารี (escape ข้อความ alt ให้แล้ว)
    box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true, alt: 'QR ลงชื่อ ' + m.title });

    fill(body, h('div', { class: 'card', style: 'text-align:center' },
      h('h2', { style: 'margin:0 0 4px', text: m.title }),
      h('p', { class: 'muted small', text: [fmtDateLong(m.date), m.time ? `เวลา ${m.time} น.` : ''].filter(Boolean).join(' ') }),
      m.place ? h('p', { class: 'small', text: 'สถานที่ ' + m.place }) : null,
      box,
      h('p', { class: 'small', text: 'สแกนด้วยกล้องมือถือ หรือกดปุ่ม "ลงชื่อเข้าร่วมประชุม" ในหน้าลงชื่อ' }),
      m.early
        ? h('div', { class: 'status wait', style: 'margin:12px 0 0' },
          h('p', { text: 'ยังไม่ถึงวันประชุม ลูกบ้านสแกนลงชื่อได้ในวันประชุมเมื่อติ๊ก "เปิดลงชื่อ" แล้ว' }))
        : null));
}
</script>
