<link rel="stylesheet" href="styles.css?v=8">
<section id="page-admin-report" hidden>
  <div class="topbar">
    <button class="back" type="button" data-go="admin"><svg data-icon="back"></svg>สำหรับผู้ดูแล</button>
  </div>
  <h1>รายงานการประชุม</h1>
  <div class="field">
    <label class="lbl" for="report-meeting">เลือกการประชุม</label>
    <select id="report-meeting"></select>
  </div>
  <div id="report-body"></div>

  <!-- ผู้ดูแลลงชื่อแทน: ต้องระบุเหตุผล (บันทึกลงชีต Attendance คอลัมน์ G–H) -->
  <dialog class="qr-dialog proxy-dialog" id="report-proxy" aria-labelledby="report-proxy-title">
    <form method="dialog">
      <h2 id="report-proxy-title"></h2>
      <p class="small muted">ชื่อของคุณและเหตุผลจะถูกบันทึกไว้ในชีต Attendance</p>
      <div class="field">
        <label class="lbl" for="report-proxy-name">ชื่อผู้เข้าประชุม</label>
        <select id="report-proxy-name"></select>
      </div>
      <div class="field" hidden>
        <label class="lbl" for="report-proxy-name-other">พิมพ์ชื่อผู้เข้าประชุม</label>
        <input type="text" id="report-proxy-name-other" maxlength="100" pattern=".*\S.*">
      </div>
      <div class="field">
        <label class="lbl" for="report-proxy-reason">เหตุผลที่ลงชื่อแทน</label>
        <select id="report-proxy-reason">
          <option>ไม่มีมือถือ</option>
          <option>ผู้สูงอายุ ใช้มือถือไม่สะดวก</option>
          <option>มือถือแบตหมดหรือเสีย</option>
          <option value="">อื่น ๆ (ระบุ)</option>
        </select>
      </div>
      <div class="field" hidden>
        <label class="lbl" for="report-proxy-other">ระบุเหตุผล</label>
        <input type="text" id="report-proxy-other" maxlength="200" pattern=".*\S.*">
      </div>
      <button class="btn" value="ok">ลงชื่อแทน</button>
      <button class="btn btn-ghost" value="cancel" formnovalidate>ยกเลิก</button>
    </form>
  </dialog>
</section>

<script>
App.register('admin-report', {
  adminOnly: true,

  async enter() {
    const sel = $('report-meeting');
    const body = $('report-body');
    fill(sel);
    sel.disabled = true;
    fill(body, loadingBox('กำลังโหลดการประชุม…'));

    let list;
    try {
      list = await App.api('adminMeetings');
    } catch (err) {
      fill(body, errorBox(err.message));
      return;
    }
    if (!list.meetings.length) {
      fill(body, h('div', { class: 'empty card', text: 'ยังไม่มีการประชุมในชีต Meetings' }));
      return;
    }

    const shortDate = (iso) => {
      const d = parseIso(iso);
      return d ? `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]} ${String(d.getFullYear() + 543).slice(-2)}` : 'ไม่ระบุวัน';
    };
    fill(sel, list.meetings.map((m) => h('option', { value: m.id,
      text: `${shortDate(m.date)} · ${m.title} (${m.count}/${list.totalHouses})` })));
    // ค่าเริ่มต้น: ประชุมวันนี้ ถ้าไม่มีใช้ครั้งล่าสุดที่ผ่านมา
    const def = list.meetings.find((m) => m.date === list.today)
      || list.meetings.find((m) => m.date && m.date < list.today)
      || list.meetings[0];
    sel.value = def.id;
    sel.disabled = false;
    sel.onchange = () => load(sel.value);
    load(def.id);

    async function load(id) {
      fill(body, loadingBox('กำลังสรุปรายงาน…'));
      try {
        show(await App.api('adminReport', { meetingId: id }));
      } catch (err) {
        fill(body, errorBox(err.message));
      }
    }

    /** ลงชื่อแทนบ้านที่ไม่มีมือถือ */
    /** dropdown ที่ตัวเลือก value '' = "อื่น ๆ" แล้วต้องพิมพ์เองในช่องถัดไป → ฟังก์ชันอ่านค่าที่เลือก/พิมพ์ */
    function pickOrType(sel, input) {
      sel.selectedIndex = 0;
      input.value = '';
      sel.onchange = () => {
        input.closest('.field').hidden = !!sel.value;
        input.required = !sel.value;
      };
      sel.onchange();
      return () => sel.value || input.value.trim();
    }

    /** ถามชื่อผู้เข้าประชุม (ลูกบ้านที่ลงทะเบียนในบ้านนั้น หรือพิมพ์เอง) และเหตุผล → { name, reason } / null = ยกเลิก */
    function askProxy(houseNo, names) {
      const dlg = $('report-proxy');
      const nameSel = $('report-proxy-name');
      $('report-proxy-title').textContent = `ลงชื่อแทนบ้านเลขที่ ${houseNo}`;
      fill(nameSel, names.map((n) => h('option', { text: n })), h('option', { value: '', text: 'อื่น ๆ (พิมพ์ชื่อ)' }));
      nameSel.closest('.field').hidden = !names.length;
      const name = pickOrType(nameSel, $('report-proxy-name-other'));
      const reason = pickOrType($('report-proxy-reason'), $('report-proxy-other'));
      dlg.returnValue = '';
      dlg.showModal();
      return new Promise((resolve) => dlg.addEventListener('close',
        () => resolve(dlg.returnValue === 'ok' ? { name: name(), reason: reason() } : null), { once: true }));
    }

    async function checkinFor(r, houseNo, btn, err) {
      const proxy = await askProxy(houseNo, (r.members || {})[houseNo] || []);
      if (!proxy) return;
      btn.disabled = true;
      err.textContent = '';
      try {
        show(await App.api('adminCheckin', { meetingId: r.meeting.id, houseNo, name: proxy.name, reason: proxy.reason }));
      } catch (e) {
        btn.disabled = false;
        err.textContent = e.message;
      }
    }

    function absentButtons(r) {
      const err = h('div', { class: 'err' });
      return h('div', {},
        h('p', { class: 'small muted', text: 'บ้านที่ไม่มีมือถือ: กดบ้านเลขที่เพื่อลงชื่อแทน' }),
        err,
        h('div', { class: 'absent' }, r.absent.map((no) => {
          const btn = h('button', { class: 'house', type: 'button', text: no, 'aria-label': `ลงชื่อแทนบ้านเลขที่ ${no}` });
          btn.addEventListener('click', () => checkinFor(r, no, btn, err));
          return btn;
        })));
    }

    function show(r) {
      const n = r.attended.length;
      const total = r.totalHouses;
      const pct = total ? Math.round((n / total) * 100) : 0;

      const exportMsg = h('div');
      const exportBtn = h('button', { class: 'btn', type: 'button', text: 'ส่งออกเป็น Google Sheets' });
      exportBtn.addEventListener('click', async () => {
        exportBtn.disabled = true;
        exportBtn.textContent = 'กำลังสร้างรายงาน…';
        try {
          const x = await App.api('adminExport', { meetingId: r.meeting.id });
          fill(exportMsg, h('div', { class: 'status ok', style: 'margin-top:12px' },
            h('p', { text: `เขียนรายงานลงแท็บ "${x.sheetName}" แล้ว (แทนที่รายงานเดิม) เปิดแล้วดาวน์โหลดเป็น PDF หรือ Excel ได้จากเมนู ไฟล์ → ดาวน์โหลด` }),
            h('a', { class: 'btn btn-ghost', style: 'margin-top:12px', href: x.url, target: '_blank', rel: 'noopener', text: 'เปิดรายงาน' })));
        } catch (err) {
          fill(exportMsg, errorBox(err.message));
        }
        exportBtn.disabled = false;
        exportBtn.textContent = 'ส่งออกเป็น Google Sheets';
      });

      fill(body,
        h('div', { class: 'summary' },
          h('div', { class: 'wide' }, h('span', { text: 'บ้านที่ลงชื่อเข้าร่วม' }), h('b', { text: `${n} / ${total} หลัง (${pct}%)` })),
          h('div', {}, h('span', { text: 'ลงชื่อแล้ว' }), h('b', { class: 'in', text: n })),
          h('div', {}, h('span', { text: 'ยังไม่ลงชื่อ' }), h('b', { class: 'out', text: r.absent.length }))),
        h('div', { class: 'bar in', role: 'img', 'aria-label': `ลงชื่อแล้ว ${pct}%`, style: 'margin:4px 0 16px' },
          h('i', { style: `width:${pct}%` })),
        exportBtn,
        exportMsg,
        h('h2', { text: `ลงชื่อแล้ว (${n})` }),
        n
          ? h('div', { class: 'table-wrap report' }, h('table', {},
            h('thead', {}, h('tr', {}, ['บ้านเลขที่', 'ผู้ลงชื่อ', 'เวลา', 'วิธี'].map((t) => h('th', { text: t })))),
            h('tbody', {}, r.attended.map((a) => h('tr', {},
              h('td', { text: a.houseNo }), h('td', { text: a.name }), h('td', { text: a.time }), h('td', { text: a.reason ? `${a.method} (${a.byAdmin}): ${a.reason}` : a.method }))))))
          : h('div', { class: 'empty card', text: 'ยังไม่มีบ้านลงชื่อ' }),
        h('h2', { text: `ยังไม่ลงชื่อ (${r.absent.length})` }),
        !r.absent.length
          ? h('div', { class: 'empty card', text: total ? 'ลงชื่อครบทุกบ้านแล้ว' : 'ยังไม่มีรายชื่อบ้านในชีต Houses' })
          : r.meeting.open
            ? absentButtons(r)
            : h('p', { class: 'absent', text: r.absent.join(', ') }));
    }
  },
});
</script>
