<link rel="stylesheet" href="styles.css?v=5">
<section id="page-emergency" hidden>
  <div class="tabs" role="tablist" aria-label="แจ้งเหตุ">
    <button type="button" role="tab" aria-controls="em-sos">แจ้งเหตุฉุกเฉิน</button>
    <button type="button" role="tab" aria-controls="em-report">แจ้งเหตุ/แจ้งซ่อม</button>
    <button type="button" role="tab" aria-controls="em-track">ติดตามสถานะ</button>
  </div>

  <div role="tabpanel" id="em-sos">
    <p class="lead">กดที่รายชื่อเพื่อโทรออกได้ทันที</p>
    <h2>หน่วยงานภายนอก</h2>
    <div id="em-outer"></div>
    <h2>แม่หลวงและผู้ช่วย</h2>
    <div id="em-inner"></div>
  </div>
  <div role="tabpanel" id="em-report" hidden></div>
  <div role="tabpanel" id="em-track" hidden></div>

  <a class="btn btn-ghost" data-close href="#" style="margin-top:28px">กลับไปที่แชท</a>
</section>

<script>
/** ประเภทหมุดในชีต MapPins → ชื่อไอคอน/คลาสสี */
const PIN_KEYS = { 'ลำโพง': 'speaker', 'ไฟส่องสว่าง': 'light', 'กล้องวงจรปิด': 'camera', 'ท่อประปา': 'pipe' };

/** ตารางบนแผนผัง: คอลัมน์ A–J, แถว 1–10 */
const GRID = 10;

/** x,y เป็น % ของแผนผัง → ชื่อช่อง เช่น "A2" */
function gridCell(x, y) {
  const c = Math.min(GRID - 1, Math.floor(x / (100 / GRID)));
  const r = Math.min(GRID - 1, Math.floor(y / (100 / GRID)));
  return String.fromCharCode(65 + c) + (r + 1);
}

function emTab(panelId) {
  document.querySelectorAll('#page-emergency [role=tab]').forEach((t) => {
    const on = t.getAttribute('aria-controls') === panelId;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    $(t.getAttribute('aria-controls')).hidden = !on;
    if (on && document.activeElement && document.activeElement.getAttribute('role') === 'tab') t.focus();
  });
}

document.querySelector('#page-emergency [role=tablist]').addEventListener('click', (e) => {
  const t = e.target.closest('[role=tab]');
  if (t) emTab(t.getAttribute('aria-controls'));
});

// ลูกศรซ้าย/ขวาเลื่อนแท็บ (คีย์บอร์ด/โปรแกรมอ่านหน้าจอ)
document.querySelector('#page-emergency [role=tablist]').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tabs = [...document.querySelectorAll('#page-emergency [role=tab]')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  emTab(next.getAttribute('aria-controls'));
});

App.register('emergency', {
  async enter() {
    emTab('em-sos');
    const sos = BOOT.sos || [];
    fill($('em-outer'), sos.length ? callList(sos) : h('div', { class: 'empty card', text: 'ยังไม่ได้ใส่เบอร์ฉุกเฉิน' }));

    const panels = [$('em-inner'), $('em-report'), $('em-track')];
    if (!App.isMember()) {
      panels.forEach((p) => fill(p, h('div', { class: 'status wait' },
        h('p', { text: 'ส่วนนี้ใช้ได้เมื่อผู้ดูแลอนุมัติการลงทะเบียนแล้ว' }))));
      return;
    }

    panels.forEach((p) => fill(p, loadingBox('กำลังโหลดข้อมูล…')));
    let data;
    try {
      data = await App.api('emergency');
    } catch (err) {
      panels.forEach((p) => fill(p, errorBox(err.message)));
      return;
    }

    fill($('em-inner'), data.inner.length
      ? callList(data.inner, true)
      : h('div', { class: 'empty card', text: 'ยังไม่ได้ใส่เบอร์ผู้ดูแล' }));
    fill($('em-report'), reportForm());
    renderList(data.incidents, '');

    function field(id, label, input, required) {
      return h('div', { class: 'field' },
        h('label', { class: 'lbl', for: id }, label, required ? h('span', { class: 'req', text: ' *' }) : null),
        input);
    }

    function reportForm() {
      const type = h('select', { id: 'em-type' },
        h('option', { value: '', text: 'เลือกประเภท' }),
        data.types.map((t) => h('option', { value: t, text: t })));
      const detail = h('textarea', { id: 'em-detail', maxlength: 1000 });
      const place = h('input', { id: 'em-place', type: 'text', maxlength: 150, placeholder: 'เช่น หน้าบ้านเลขที่ 12 ซอย 3' });
      const err = h('div', { class: 'form-error', role: 'alert' });
      const btn = h('button', { class: 'btn', type: 'submit', text: 'ส่งเรื่อง' });
      // ส่งตำแหน่งจากแผนที่ที่เลือกล่าสุด: ปักบนแผนที่หนึ่งแล้วล้างหมุดบนอีกแผนที่
      let point = '';
      const village = villageMap(data.map, data.isAdmin, (label) => { if (label) street.reset(); point = label; });
      const street = streetMap(data.map, (link) => { village.reset(); point = link; });
      const radio = (value, text, checked) => h('label', {},
        h('input', { type: 'radio', name: 'em-mapsrc', value, checked, onchange: () => {
          village.hidden = value !== 'village';
          if (value === 'street') street.show(); else street.hidden = true;
        } }), text);
      const mapEl = window.L
        ? h('div', {}, h('div', { class: 'legend', role: 'radiogroup', 'aria-label': 'เลือกแผนที่' },
          radio('village', 'แผนที่หมู่บ้าน', true), radio('street', 'แผนที่จริง', false)), village, street)
        : village;
      const form = h('form', { novalidate: true },
        h('div', { class: 'status bad' },
          h('p', { text: 'เหตุอันตรายต่อชีวิตหรือทรัพย์สิน กรุณาโทรจากแท็บ "แจ้งเหตุฉุกเฉิน" ทันที' })),
        field('em-type', 'ประเภท', type, true),
        field('em-detail', 'รายละเอียด', detail, true),
        h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'ปักหมุดตำแหน่งบนแผนที่' }), mapEl),
        field('em-place', 'รายละเอียดสถานที่เพิ่มเติม', place, false),
        err, btn);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'กำลังส่ง…';
        err.textContent = '';
        try {
          const res = await App.api('report', {
            type: type.value,
            detail: detail.value,
            place: [point, place.value.trim()].filter(Boolean).join(' · '),
          });
          fill($('em-report'), reportForm());
          renderList(res.incidents, 'ส่งเรื่องเรียบร้อย ผู้ดูแลได้รับแจ้งแล้ว');
          emTab('em-track');
          window.scrollTo(0, 0);
        } catch (ex) {
          err.textContent = ex.message;
        }
        btn.disabled = false;
        btn.textContent = 'ส่งเรื่อง';
      });
      return form;
    }

    function renderList(items, okMessage) {
      fill($('em-track'),
        okMessage ? h('div', { class: 'status ok', role: 'status' }, h('p', { text: okMessage })) : null,
        items.length ? items.map(incidentCard) : h('div', { class: 'empty card', text: 'ยังไม่มีเรื่องที่แจ้ง' }));
    }

    /** แสดงแค่หัวเรื่อง + สีสถานะ แตะเพื่อดูรายละเอียด (เรื่องเยอะแล้วหาเรื่องล่าสุดง่าย) */
    function incidentCard(i) {
      const step = Math.max(0, data.statuses.indexOf(i.status));
      const d = parseIso(i.date);
      const when = d ? `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear() + 543}` : '';
      return h('details', { class: 'card news inc st' + step },
        h('summary', {},
          h('span', { class: 'badge st' + step, text: i.status }),
          h('h3', { class: 'inc-title', text: i.type }),
          h('p', { class: 'muted small', text: `${i.id} · ${when}${i.time ? ` ${i.time} น.` : ''}` }),
          h('span', { class: 'more', text: 'แตะเพื่อดูรายละเอียด' })),
        h('p', { class: 'inc-detail', text: i.detail }),
        i.place ? h('p', { class: 'muted small', text: 'สถานที่: ' + i.place }) : null,
        h('ol', { class: 'steps', 'aria-label': 'สถานะ: ' + i.status },
          data.statuses.map((s, n) => h('li', {
            class: n <= step ? 'done s' + n : null,
            'aria-current': n === step ? 'step' : null,
            text: s,
          }))),
        i.note ? h('p', { class: 'small', text: 'หมายเหตุจากผู้ดูแล: ' + i.note }) : null);
    }

    /** แผนที่ในฟอร์มแจ้งเรื่อง (Leaflet บนรูปแผนที่หมู่บ้าน): ซูม/เลื่อนได้ แตะเพื่อเลือกช่อง (เช่น จุด A2) หรือแตะหมุดอุปกรณ์ แล้วส่งค่าให้ onPick */
    function villageMap(map, isAdmin, onPick) {
      const hint = 'ซูมด้วยสองนิ้วหรือปุ่ม + − แล้วแตะบนแผนที่เพื่อปักหมุด หรือแตะหมุดอุปกรณ์ที่ชำรุด';
      const info = h('p', { class: 'map-info', 'aria-live': 'polite', text: hint });
      if (!window.L) {
        info.textContent = 'โหลดแผนที่ไม่สำเร็จ กรุณาระบุสถานที่ในช่องด้านล่างแทน';
        return info;
      }
      const box = h('div', { class: 'map' });
      const legend = h('div', { class: 'legend' });
      const clear = h('button', { class: 'btn btn-ghost', type: 'button', text: 'ล้างตำแหน่งที่เลือก', hidden: true });
      // รูปแผนที่หมู่บ้านในเว็บ (assets/) ถ้าผู้ดูแลตั้ง MAP_FILE_ID หลังบ้านจะส่งรูปจาก Drive มาแทน
      const src = map.image || 'assets/village-map.png';
      const img = new Image();
      img.onload = img.onerror = () => draw(img.naturalWidth || 1000, img.naturalHeight || 1000);
      img.src = src;
      const wrap = h('div', {}, legend, box, info, clear);
      wrap.reset = () => { if (!clear.hidden) clear.click(); };
      return wrap;

      // ต้องรู้ขนาดรูปก่อน เพราะพิกัดหมุดในชีตเป็น % ของกว้าง/สูง
      function draw(W, H) {
        const bounds = [[-H, 0], [0, W]];
        const at = (x, y) => [-y / 100 * H, x / 100 * W];
        box.style.aspectRatio = W + ' / ' + H;
        const lmap = L.map(box, {
          // minZoom ติดลบได้ เพราะรูปใหญ่กว่ากรอบบนมือถือ (ค่าจริงตั้งใหม่ตอนรู้ขนาดกรอบ)
          crs: L.CRS.Simple, minZoom: -5, zoomSnap: 0, maxBounds: bounds, maxBoundsViscosity: 1,
          zoomControl: false, attributionControl: false, scrollWheelZoom: false, dragging: false,
        });
        L.control.zoom({ position: 'bottomright', zoomInTitle: 'ซูมเข้า', zoomOutTitle: 'ซูมออก' }).addTo(lmap);
        L.imageOverlay(src, bounds, { alt: 'แผนที่หมู่บ้านฮ่างต่ำเหนือ' }).addTo(lmap);

        // เส้นตาราง A–J / 1–10
        const lines = [];
        for (let i = 1; i < GRID; i++) {
          const v = i * 100 / GRID;
          lines.push([at(v, 0), at(v, 100)], [at(0, v), at(100, v)]);
        }
        L.polyline(lines, { className: 'grid', interactive: false }).addTo(lmap);
        for (let i = 0; i < GRID; i++) {
          const mid = (i + 0.5) * 100 / GRID;
          const label = (pos, cls, text) => L.marker(pos, { interactive: false, keyboard: false,
            icon: L.divIcon({ className: 'gl ' + cls, iconSize: null, html: `<span>${text}</span>` }) }).addTo(lmap);
          label(at(mid, 0), 'col', String.fromCharCode(65 + i));
          label(at(0, mid), 'row', i + 1);
        }

        // ประเภทละชั้น ให้ติ๊กเปิด/ปิดจากคำอธิบายสัญลักษณ์ได้
        const layers = {};
        map.types.forEach((type) => {
          const key = PIN_KEYS[type];
          layers[type] = L.layerGroup().addTo(lmap);
          const cb = h('input', { type: 'checkbox', checked: true });
          cb.addEventListener('change', () => (cb.checked ? layers[type].addTo(lmap) : layers[type].remove()));
          legend.append(h('label', {}, cb, h('i', { class: 't-' + key }), type));
        });

        map.pins.forEach((p) => {
          const layer = layers[p.type] || (layers[p.type] = L.layerGroup().addTo(lmap));
          if (p.type === 'ท่อประปา') {
            if (p.points.length > 1) L.polyline(p.points.map(([x, y]) => at(x, y)), { className: 'pipe', interactive: false }).addTo(layer);
            return;
          }
          const [x, y] = p.points[0];
          const key = PIN_KEYS[p.type];
          const m = L.marker(at(x, y), { icon: L.divIcon({ className: 'pin t-' + key, iconSize: [34, 34], html: icon(key) }) })
            .on('click', () => select(x, y, p))
            // ตัวหมุดถูกสร้างตอนแผนที่แสดงครั้งแรก (แท็บซ่อนอยู่ตอนนี้)
            .on('add', () => m.getElement().setAttribute('aria-label', `${p.type} ${p.name} จุด ${gridCell(x, y)}`))
            .addTo(layer);
        });

        const mark = L.marker([0, 0], { interactive: false, keyboard: false,
          icon: L.divIcon({ className: 'mark', iconSize: [32, 32], iconAnchor: [16, 39], html: '<i></i>' }) });

        function select(x, y, pin) {
          const label = 'จุด ' + gridCell(x, y) + (pin ? ` (${pin.type} ${pin.name})` : '');
          mark.setLatLng(at(x, y)).addTo(lmap);
          clear.hidden = false;
          // ผู้ดูแลเห็นค่า x,y ด้วย สำหรับใส่ในชีต MapPins
          info.textContent = 'ตำแหน่งที่เลือก: ' + label + (pin && pin.note ? ` · ${pin.note}` : '') +
            (isAdmin ? ` · x,y = ${x.toFixed(1)},${y.toFixed(1)}` : '');
          onPick(label);
        }

        clear.addEventListener('click', () => {
          mark.remove();
          clear.hidden = true;
          info.textContent = hint;
          onPick('');
        });

        lmap.on('click', (e) => {
          const x = e.latlng.lng / W * 100;
          const y = -e.latlng.lat / H * 100;
          if (x >= 0 && x <= 100 && y >= 0 && y <= 100) select(x, y, null);
        });

        // ยังไม่ซูม: นิ้วเดียวเลื่อนหน้าเว็บได้ตามปกติ / ซูมแล้ว: ลากเลื่อนแผนที่ได้
        lmap.on('zoomend', () => lmap.dragging[lmap.getZoom() > lmap.getMinZoom() + 0.01 ? 'enable' : 'disable']());

        // แท็บนี้ซ่อนอยู่ตอนสร้าง ต้องรอให้กล่องมีขนาดก่อนจึงจัดรูปให้พอดีกรอบ
        let fitted = false;
        new ResizeObserver(() => {
          if (!box.clientWidth) return;
          lmap.invalidateSize();
          const z = lmap.getBoundsZoom(bounds);
          lmap.setMinZoom(z).setMaxZoom(z + 3);
          if (!fitted) lmap.fitBounds(bounds);
          fitted = true;
        }).observe(box);
      }
    }

    /** แผนที่จริง ภาพดาวเทียม Esri หรือถนน OpenStreetMap (ไม่ต้องใช้ API key) แตะเพื่อปักหมุด แล้วส่งลิงก์ Google Maps ของจุดนั้นให้ onPick */
    function streetMap(map, onPick) {
      // แผนผังหมู่บ้านเป็นภาพจาก Google Maps (ทิศเหนือขึ้น ตามมาตราส่วน) จึงแปลง x,y % เป็นพิกัดจริงจากจุดอ้างอิง 2 จุดได้
      // shortcut: เทียบเชิงเส้น คลาดเคลื่อนไม่กี่เมตรในระยะหมู่บ้าน ถ้าเปลี่ยนรูปแผนผังต้องแก้ MAP_REF ใน config.js ด้วย
      const ref = CONFIG.MAP_REF;
      const toLL = ref && (([x, y]) => {
        const [a, b] = ref;
        return [a.lat + (y - a.y) * (b.lat - a.lat) / (b.y - a.y), a.lng + (x - a.x) * (b.lng - a.lng) / (b.x - a.x)];
      });
      const hint = 'เลื่อนและซูมไปยังจุดเกิดเหตุ แล้วแตะเพื่อปักหมุด ผู้ดูแลจะได้ลิงก์ Google Maps ของจุดนั้น';
      const box = h('div', { class: 'map', style: 'aspect-ratio: 1' });
      const info = h('p', { class: 'map-info', 'aria-live': 'polite', text: hint });
      const wrap = h('div', { hidden: true }, box, info);
      let lmap, mark;
      // สร้างตอนเปิดดูครั้งแรก เพราะ Leaflet ต้องรู้ขนาดกรอบ (ตอนซ่อนกว้าง 0)
      wrap.show = () => {
        wrap.hidden = false;
        if (lmap) return void lmap.invalidateSize();
        lmap = L.map(box, { scrollWheelZoom: false, zoomControl: false }).setView(CONFIG.MAP_CENTER, 16);
        L.control.zoom({ position: 'bottomright', zoomInTitle: 'ซูมเข้า', zoomOutTitle: 'ซูมออก' }).addTo(lmap);
        // ภาพดาวเทียม Esri (ฟรี ไม่ต้องใช้ key ไม่มีป้ายชื่อ) ซูมเกิน 18 ใช้ภาพขยาย เพราะชนบทมักไม่มีภาพละเอียดกว่านั้น
        const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19, maxNativeZoom: 18, attribution: 'Imagery &copy; Esri',
        }).addTo(lmap);
        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        });
        // อุปกรณ์จากชีต MapPins ประเภทละชั้น เปิด/ปิดได้จากปุ่มชั้นแผนที่
        const overlays = {};
        if (toLL) map.pins.forEach((p) => {
          const layer = overlays[p.type] || (overlays[p.type] = L.layerGroup().addTo(lmap));
          if (p.type === 'ท่อประปา') {
            if (p.points.length > 1) L.polyline(p.points.map(toLL), { className: 'pipe', interactive: false }).addTo(layer);
            return;
          }
          const key = PIN_KEYS[p.type];
          const m = L.marker(toLL(p.points[0]), { title: `${p.type} ${p.name}`,
            icon: L.divIcon({ className: 'pin t-' + key, iconSize: [34, 34], html: icon(key) }) })
            .on('click', () => pick(m.getLatLng(), p))
            .addTo(layer);
        });
        L.control.layers({ 'ดาวเทียม': sat, 'ถนน': osm }, overlays, { position: 'topright' }).addTo(lmap);
        mark = L.marker(CONFIG.MAP_CENTER, { interactive: false, keyboard: false,
          icon: L.divIcon({ className: 'mark', iconSize: [32, 32], iconAnchor: [16, 39], html: '<i></i>' }) });
        lmap.on('click', (e) => pick(e.latlng, null));
      };
      function pick(latlng, pin) {
        const ll = latlng.lat.toFixed(6) + ',' + latlng.lng.toFixed(6);
        const name = pin ? `${pin.type} ${pin.name}` : '';
        mark.setLatLng(latlng).addTo(lmap);
        info.textContent = 'ตำแหน่งที่เลือก: ' + (name ? name + (pin.note ? ` · ${pin.note}` : '') + ' · ' : '') + ll + ' (ส่งเป็นลิงก์ Google Maps)';
        onPick((name ? name + ' ' : '') + 'https://maps.google.com/?q=' + ll);
      }
      wrap.reset = () => {
        if (mark) mark.remove();
        info.textContent = hint;
      };
      return wrap;
    }
  },
});
</script>
